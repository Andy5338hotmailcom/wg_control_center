<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5楼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: url("bg.jpg") no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        h2 {
            color: #fff;
            text-shadow: 0 2px 8px #00000070;
            font-size:36px;
        }
        .room-wrap {
            display:flex;
            gap:16px;
            flex-wrap:wrap;
            justify-content:center;
        }
        .room-btn {
            padding: 16px 28px;
            font-size: 20px;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 16px;
            cursor: pointer;
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            background: rgba(41, 128, 185, 0.35);
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: 0.25s ease;
        }
        .room-btn:hover {
            background: rgba(41, 128, 185, 0.55);
            transform: translateY(-3px);
        }
        .back-btn {
            margin-top:20px;
            padding: 12px 28px;
            font-size: 18px;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 14px;
            cursor: pointer;
            backdrop-filter: blur(12px) saturate(140%);
            -webkit-backdrop-filter: blur(12px) saturate(140%);
            background: rgba(91, 76, 219, 0.35);
            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: 0.25s ease;
        }
        .back-btn:hover {
            background: rgba(91, 76, 219, 0.55);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <h2>5楼 教室区域</h2>
    <div class="room-wrap">
        <button class="room-btn" onclick="location.href='http://127.0.0.1:8550/heChang/index.html?back=http://127.0.0.1:8553/new/5.html'">合唱教室</button>
        <button class="room-btn" onclick="location.href='https://example.com'">昆曲教室</button>
        <button class="room-btn" onclick="location.href='https://example.com'">弦乐教室</button>
    </div>
    <button class="back-btn" onclick="location.href='index.html'">返回楼层导览首页</button>
</body>
</html>
