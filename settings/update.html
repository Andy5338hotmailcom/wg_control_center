<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>检查更新</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, Segoe UI, sans-serif;
        }
        body {
            background: #fff;
            color: #000;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            padding: 20px 0;
        }
        .sidebar-item {
            padding: 14px 20px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-item:hover {
            background: #e8e8e8;
        }
        .sidebar-item.active {
            background: #007aff;
            color: #fff;
        }
        .sidebar-item img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }
        .main {
            flex: 1;
            padding: 40px;
            overflow: auto;
        }
        .container{
            max-width:520px;
            background:#f5f7fa;
            padding:28px;
            border-radius:12px;
            box-shadow: 0 2px 14px rgba(0,0,0,0.1);
        }
        .channel-select{
            margin-bottom:20px;
        }
        .channel-select label{
            margin-right:18px;
            cursor:pointer;
        }
        .status{
            margin-top:20px;
            font-size:16px;
            line-height:1.8;
        }
        .loading{
            color:#666;
        }
        .latest{
            color:#008833;
        }
        .need-update{
            color:#d03030;
        }
        .error{
            color:#993300;
        }
        button {
            padding: 8px 16px;
            border: none;
            background-color: #007aff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size:15px;
        }
        button:hover {
            background-color: #0066dd;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-item">
        <img src="setting.svg" alt="">
        设置
    </div>
    <div class="sidebar-item" onclick="window.location.href='./set_changelog.html'">
        <img src="txt.png" alt="">
        更新日志
    </div>
    <div class="sidebar-item active">
        <img src="update.png" alt="">
        检查更新
    </div>
    <div class="sidebar-item" onclick="window.location.href='./set_license.html'">
        <img src="txt.png" alt="">
        许可条款
    </div>
    <div class="sidebar-item" onclick="window.location.href='./feedback.html'">
        <img src="feedback.svg" alt="">
        反馈和评价
    </div>
</div>
<div class="main">
    <div class="container">
        <h2 id="pageTitle">检查更新--正式版</h2>
        <div class="channel-select">
            <label><input type="radio" name="channel" value="stable" checked onchange="checkUpdate()"> 正式版通道</label>
            <label><input type="radio" name="channel" value="preview" onchange="checkUpdate()"> 预览版通道</label>
        </div>
        <div class="status" id="statusText">
            <div class="loading">正在请求更新服务器……</div>
        </div>
    </div>
</div>
<script>
// ========== 全局固定配置 ==========
const localVersion = "18";
const remoteUrl = "https://andy5338hotmailcom.github.io/appsdowlandpagesandupdate/update/infoboard/checkupdate.txt";
const statusDom = document.getElementById("statusText");
const titleDom = document.getElementById("pageTitle");

// 两套通道行号配置
const channelConfig = {
    stable: {
        title: "检查更新--正式版",
        verLine: 1,        // 版本号 第2行，索引1
        mainLine: 10,      // 主下载链接 第11行，索引10
        backupLine: 11     // 补救链接 第12行，索引11（主+1）
    },
    preview: {
        title: "检查更新--预览版",
        verLine: 3,        // 版本号 第4行，索引3
        mainLine: 7,       // 主下载链接 第8行，索引7
        backupLine: 8      // 补救链接 第9行，索引8（主+1）
    }
};

// 全局下载触发
function triggerDownload(cdnUrl, backupUrl) {
    if(!cdnUrl){
        alert("未获取到更新包链接");
        return;
    }
    console.log("优先尝试GH-Proxy加速链接：", cdnUrl);
    statusDom.innerHTML += `<div style="margin-top:12px;color:#007aff;">正在从加速服务器下载更新包，若长时间无响应，可点击下方备用链接</div>
    <div style="margin-top:8px;"><button onclick="window.open('${backupUrl}')">使用备用Github源下载</button></div>`;
    const a = document.createElement('a');
    a.href = cdnUrl;
    document.body.appendChild(a);
    a.click();
    a.remove();
}

async function checkUpdate(){
    // 获取选中通道
    const selectedChannel = document.querySelector('input[name="channel"]:checked').value;
    const cfg = channelConfig[selectedChannel];
    titleDom.innerText = cfg.title;
    statusDom.innerHTML = `<div class="loading">正在请求更新服务器……</div>`;

    try{
        const resp = await fetch(remoteUrl);
        if(!resp.ok){
            throw new Error(`HTTP ${resp.status}`);
        }
        const text = await resp.text();
        const lines = text.split(/\r?\n/);
        // 读取对应行
        const remoteVer = (lines[cfg.verLine] || "").trim();
        const cdnDownloadUrl = (lines[cfg.mainLine] || "").trim();
        const backupDownloadUrl = (lines[cfg.backupLine] || "").trim();

        if(remoteVer === localVersion){
            // 已是最新：只显示本地版本，不展示远程版本
            statusDom.innerHTML = `
                <div class="latest">✅ 你是最新版本</div>
                <div>当前版本：${localVersion}</div>
            `;
        }else{
            // 需要更新：同时显示本地+远程版本，带下载按钮
            statusDom.innerHTML = `
                <div class="need-update">⚠️ 需要更新</div>
                <div>当前版本：${localVersion}</div>
                <div>最新版本：${remoteVer}</div>
                <div style="margin-top:24px;">
                    <button onclick="triggerDownload('${cdnDownloadUrl}','${backupDownloadUrl}')">下载更新</button>
                </div>
            `;
        }
    }catch(err){
        statusDom.innerHTML = `
            <div class="error">❌ 更新清单获取失败</div>
            <div>错误信息：${err.message}</div>
            <div>本地版本：${localVersion}</div>
            <div>提示：无法连接更新清单，可手动复制备用链接下载</div>
        `;
    }
}
// 页面加载立刻执行
checkUpdate();
</script>
</body>
</html>
