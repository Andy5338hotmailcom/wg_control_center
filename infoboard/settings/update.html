<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>检查更新</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, Segoe UI, sans-serif;
        }
        body {
            background: #fff;
            color: #000;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            padding: 20px 0;
        }
        .sidebar-item {
            padding: 14px 20px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-item:hover {
            background: #e8e8e8;
        }
        .sidebar-item.active {
            background: #007aff;
            color: #fff;
        }
        .sidebar-item img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }
        .main {
            flex: 1;
            padding: 40px;
            overflow: auto;
        }
        /* 内嵌更新面板样式，原updatepage */
        .container{
            max-width:520px;
            background:#f5f7fa;
            padding:28px;
            border-radius:12px;
            box-shadow: 0 2px 14px rgba(0,0,0.1);
        }
        .status{
            margin-top:20px;
            font-size:16px;
            line-height:1.8;
        }
        .loading{
            color:#666;
        }
        .latest{
            color:#008833;
        }
        .need-update{
            color:#d03030;
        }
        .error{
            color:#993300;
        }
        button {
            padding: 8px 16px;
            border: none;
            background-color: #007aff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size:15px;
        }
        button:hover {
            background-color: #0066dd;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-item">
        <img src="setting.svg" alt="">
        设置
    </div>
    <div class="sidebar-item" onclick="window.location.href='./set_changelog.html'">
        <img src="txt.png" alt="">
        更新日志
    </div>
    <div class="sidebar-item active">
        <img src="update.png" alt="">
        检查更新
    </div>
    <div class="sidebar-item" onclick="window.location.href='./set_license.html'">
        <img src="txt.png" alt="">
        许可条款
    </div>
    <div class="sidebar-item" onclick="window.location.href='./feedback.html'">
        <img src="feedback.svg" alt="">
        反馈和评价
    </div>
    <div class="sidebar-item" onclick="window.location.href='../index.html'">
        <img src="home.png" alt="">
        主页
    </div>
</div>
<div class="main">
    <div class="container">
        <h2>检查更新--预览版本</h2>
        <div class="status" id="statusText">
            <div class="loading">正在请求更新服务器……</div>
        </div>
    </div>
</div>
<script>
// ========== 这里修改你的变量 ==========
const localVersion = "18.1.1";
const checkLineIndex = 4; // 获取第2或4行，行号从1开始
const downloadUrlLineIndex = 8; // 更新包下载链接在远端txt第8行
const remoteUrl = "https://andy5338hotmailcom.github.io/appsdowlandpagesandupdate/update/infoboard/checkupdate.txt";
const statusDom = document.getElementById("statusText");

// 全局按钮回调
function triggerDownload(url) {
    if(!url){
        alert("未获取到更新包链接");
        return;
    }
    console.log("点击下载更新，下载地址：", url);
}

async function checkUpdate(){
    try{
        const resp = await fetch(remoteUrl);
        if(!resp.ok){
            throw new Error(`HTTP ${resp.status}`);
        }
        const text = await resp.text();
        const lines = text.split(/\r?\n/);
        // 取版本号
        const remoteVer = (lines[checkLineIndex -1] || "").trim();
        // 取下载地址
        const downloadUrl = (lines[downloadUrlLineIndex -1] || "").trim();

        if(remoteVer === localVersion){
            statusDom.innerHTML = `
                <div class="latest">✅ 你是最新版本</div>
                <div>当前版本：${localVersion}</div>
            `;
        }else{
            statusDom.innerHTML = `
                <div class="need-update">⚠️ 需要更新</div>
                <div>当前版本：${localVersion}</div>
                <div>最新版本：${remoteVer}</div>
                <div style="margin-top:24px;">
                    <button onclick="triggerDownload('${downloadUrl}')">下载更新</button>
                </div>
            `;
        }
    }catch(err){
        statusDom.innerHTML = `
            <div class="error">❌ 更新检查失败</div>
            <div>错误信息：${err.message}</div>
            <div>本地版本：${localVersion}</div>
        `;
    }
}
// 页面加载立刻执行
checkUpdate();
</script>
</body>
</html>
