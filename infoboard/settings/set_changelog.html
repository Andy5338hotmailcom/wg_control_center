<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>更新日志</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #fff;
            color: #000;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            padding: 20px 0;
        }
        .sidebar-item {
            padding: 14px 20px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
            .sidebar-item:hover {
                background: #e8e8e8;
            }
            .sidebar-item.active {
                background: #007aff;
                color: #fff;
            }
            .sidebar-item img {
                width: 18px;
                height: 18px;
                object-fit: contain;
            }
        .main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
        .title {
            font-size: 26px;
            margin-bottom: 30px;
        }
        .box {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 24px;
        }
        .row {
            margin: 16px 0;
        }
        button {
            padding: 10px 18px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        /* 日志渲染样式（原changelog.html的样式） */
        .ver-item{
            margin-bottom:20px;
            border:1px solid #eee;
            border-radius:10px;
            padding:16px;
            background:#f9f9f9;
        }
        .ver-head{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:10px;
        }
        .ver-tag{
            background:#007aff;
            color:#fff;
            padding:2px 7px;
            border-radius:5px;
            font-size:13px;
        }
        .ver-date{
            color:#666;
            font-size:13px;
            margin-left:8px;
        }
        .ver-desc{
            font-size:17px;
            margin-bottom:8px;
        }
        .toggle-btn{
            border:none;
            background:none;
            color:#007aff;
            cursor:pointer;
            font-size:14px;
        }
        .log-detail{
            margin-top:10px;
            padding-top:10px;
            border-top:1px solid #ddd;
            display:none;
        }
        .log-detail.open{
            display:block;
        }
        .log-detail li{
            margin:6px 0;
            margin-left:20px;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-item">
        <img src="setting.svg" alt="">
        设置
    </div>
    <div class="sidebar-item active">
        <img src="txt.png" alt="">
        更新日志
    </div>
    <div class="sidebar-item" onclick="window.location.href='./update.html'">
        <img src="update.png" alt="">
        检查更新
    </div>
    <div class="sidebar-item" onclick="window.location.href='./set_license.html'">
        <img src="txt.png" alt="">
        许可条款
    </div>
    <div class="sidebar-item" onclick="window.location.href='./feedback.html'">
        <img src="feedback.svg" alt="">
        反馈和评价
    </div>
    <div class="sidebar-item" onclick="window.location.href='../index.html'">
        <img src="home.png" alt="">
        主页
    </div>
</div>
<div class="main">
    <h1 class="title">更新日志</h1>
    <div id="logWrap"></div>
</div>

<!-- 加载外部数据文件，不使用fetch -->
<script src="./changelog.js"></script>
<script>
const logWrap = document.getElementById('logWrap');
function render(){
    logWrap.innerHTML = '';
    changelogData.forEach(item=>{
        const div = document.createElement('div');
        div.className = 'ver-item';
        div.innerHTML = `
            <div class="ver-head">
                <div>
                    <span class="ver-tag">${item.version}</span>
                    <span class="ver-date">${item.date}</span>
                </div>
                <button class="toggle-btn">展开详情</button>
            </div>
            <div class="ver-desc">${item.description}</div>
            <div class="log-detail">
                <ul>
                    ${item.changes.map(c=>`<li>${c}</li>`).join('')}
                </ul>
            </div>
        `;
        logWrap.appendChild(div);
        const btn = div.querySelector('.toggle-btn');
        const detail = div.querySelector('.log-detail');
        btn.onclick = ()=>{
            detail.classList.toggle('open');
            btn.innerText = detail.classList.contains('open') ? '收起' : '展开详情';
        }
    })
}
render();

function switchToBlack() {
    localStorage.setItem("WG_color", "b");
    window.location.href = "personalized_b.html";
}
</script>
</body>
</html>
