<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错误页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#6C63FF' } } }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-purple-100 to-purple-200 min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full bg-white rounded-xl shadow-2xl p-8 text-center">
    <h1 id="error-code" class="text-6xl font-bold text-primary mb-4">404</h1>
    <p id="error-msg" class="text-xl text-gray-600">未知的错误</p>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '404';
    const why = params.get('why') || '未知的错误';
    document.getElementById('error-code').textContent = code;
    document.getElementById('error-msg').textContent = why;
    document.title = code + ' - ' + why;
</script>
</body>
</html>
